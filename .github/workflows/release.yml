name: Release

# Push a tag like v0.2.0 to build the installer and the portable zip and attach them to a draft
# GitHub release. Review the draft, then publish it: the website links to releases/latest.
# A release created on GitHub first (with a new tag) works too: the files are added to it, and its text is
# replaced with the version's CHANGELOG.md section.
# "Run workflow" (manual) builds the same files as a workflow artifact, without any release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Code signing starts once the SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret exist,
      # for tagged releases only (a manual run stays unsigned and needs no approval).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            $props = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ }
            if ($props -ne ($version -split '-')[0]) {
              Write-Warning "Tag $env:GITHUB_REF_NAME, but Directory.Build.props says $props."
            }
          }
          else {
            $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Fetch bundled tools
        shell: pwsh
        run: ./tools/fetch-tools.ps1

      - name: Test
        run: dotnet test --solution SmashIt.slnx -c Release

      # Unsigned build: manual runs, and tags while code signing isn't set up.
      - name: Build installer and zip
        if: env.SIGN != 'true'
        shell: pwsh
        run: ./tools/publish.ps1 -Version ${{ steps.version.outputs.value }}

      # Signed build (SignPath Foundation, see CODE_SIGNING.md): Smash It's own files are signed first, then
      # packaged, then the installer is signed. Each signing request waits for its approval on SignPath.
      - name: Publish the app
        if: env.SIGN == 'true'
        shell: pwsh
        run: ./tools/publish.ps1 -Version ${{ steps.version.outputs.value }} -Step Stage

      - name: Upload the app files to sign
        if: env.SIGN == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-files
          path: |
            artifacts/publish/SmashIt/SmashIt.exe
            artifacts/publish/SmashIt/SmashIt.dll
            artifacts/publish/SmashIt/SmashIt.Cli.exe
            artifacts/publish/SmashIt/SmashIt.Cli.dll
            artifacts/publish/SmashIt/SmashIt.Core.dll
            artifacts/publish/SmashIt/SmashIt.Presentation.dll
          if-no-files-found: error

      - name: Sign the app files
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: smash-it
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200 # approve on SignPath within 2 hours
          output-artifact-directory: artifacts/publish/SmashIt
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Build installer and zip from the signed files
        if: env.SIGN == 'true'
        shell: pwsh
        run: ./tools/publish.ps1 -Version ${{ steps.version.outputs.value }} -Step Package

      - name: Upload the installer to sign
        if: env.SIGN == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: artifacts/SmashIt-Setup-x64.exe
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: smash-it
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200 # approve on SignPath within 2 hours
          output-artifact-directory: artifacts
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Checksums of the signed files
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($file in 'artifacts/publish/SmashIt/SmashIt.exe', 'artifacts/SmashIt-Setup-x64.exe') {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file : signature $($signature.Status)." }
            Write-Host "$file signed by $($signature.SignerCertificate.Subject)"
          }
          ./tools/publish.ps1 -Version ${{ steps.version.outputs.value }} -Step Checksums

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: SmashIt-${{ steps.version.outputs.value }}
          path: |
            artifacts/SmashIt-Setup-x64.exe
            artifacts/SmashIt-win-x64.zip
            artifacts/SHA256SUMS.txt

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = 'artifacts/SmashIt-Setup-x64.exe', 'artifacts/SmashIt-win-x64.zip', 'artifacts/SHA256SUMS.txt'
          # The release text is the version's section of CHANGELOG.md, the same one the app shows.
          $notes = ./tools/changelog-section.ps1 -Version '${{ steps.version.outputs.value }}'
          if ($notes) { $notes | Set-Content release-notes.md -Encoding utf8 }
          else { Write-Warning "CHANGELOG.md has no '## v${{ steps.version.outputs.value }}' section." }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            # A release created by hand on GitHub (which also creates the tag): add the files, and replace the
            # text with the changelog's when there is a section for this version.
            gh release upload $env:GITHUB_REF_NAME @files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($notes) { gh release edit $env:GITHUB_REF_NAME --notes-file release-notes.md }
          }
          else {
            $extra = @()
            if ('${{ steps.version.outputs.value }}' -match '-') { $extra += '--prerelease' }
            if ($notes) { $extra += '--notes-file', 'release-notes.md' }
            else { $extra += '--generate-notes' } # lists the pull requests instead
            gh release create $env:GITHUB_REF_NAME @files `
              --draft --title "Smash It ${{ steps.version.outputs.value }}" @extra
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
