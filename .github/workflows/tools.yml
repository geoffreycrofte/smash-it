name: Build tools

# Some bundled tools publish no Windows x64 build, or none that suits Smash It. This workflow builds or mirrors them
# and attaches them to a "tools-<name>-<version>" pre-release of this repository, where tools/fetch-tools.ps1
# downloads them (pinned by SHA-256, like every other tool).
#
# - oxvg: compiled from its tagged source (its own release only has an ARM64 Windows exe).
#     git tag tools-oxvg-0.0.9 && git push origin tools-oxvg-0.0.9
# - ffmpeg: compiled in MSYS2 with only what Smash It uses (tools/ffmpeg-configure.sh), statically: one exe, no DLL,
#   about a third of a full build. The release carries the FFmpeg source and the MSYS2 source package of every
#   library linked in (GPL). "Run workflow" (manual) builds it as an artifact without publishing, to try changes.
#     git tag tools-ffmpeg-9.0.2-slim && git push origin tools-ffmpeg-9.0.2-slim
# - pngquant: mirrored unchanged: pngquant.org only publishes an unversioned zip and sometimes times out in CI.
#     git tag tools-pngquant-2.17.0 && git push origin tools-pngquant-2.17.0
#
# These releases are pre-releases and never "latest": the app's download links and update check ignore them.
on:
  push:
    tags: ['tools-oxvg-*', 'tools-ffmpeg-*', 'tools-pngquant-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oxvg:
    if: startsWith(github.ref_name, 'tools-oxvg-')
    runs-on: windows-latest
    steps:
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^tools-oxvg-', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected tag $env:GITHUB_REF_NAME" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Get the oxvg source
        shell: pwsh
        run: git clone --depth 1 --branch "v${{ steps.version.outputs.value }}" https://github.com/noahbald/oxvg.git oxvg

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        working-directory: oxvg
        shell: pwsh
        env:
          # The C runtime is linked in: the exe runs on its own, without the Visual C++ redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --package oxvg --bins --target x86_64-pc-windows-msvc

      - name: Check
        shell: pwsh
        run: |
          $exe = 'oxvg/target/x86_64-pc-windows-msvc/release/oxvg.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'oxvg.exe does not run.' }
          '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><!-- c --><rect width="10" height="10"/></svg>' |
            Set-Content test.svg -Encoding utf8
          & $exe optimise test.svg --output test.min.svg
          Get-Content test.min.svg

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item oxvg/target/x86_64-pc-windows-msvc/release/oxvg.exe dist/oxvg-$version-x86_64-pc-windows-msvc.exe
          Copy-Item oxvg/LICENSE dist/oxvg-LICENSE.txt
          $hash = (Get-FileHash "dist/oxvg-$version-x86_64-pc-windows-msvc.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          oxvg $version (https://github.com/noahbald/oxvg, MIT), compiled for Windows x64 from its v$version tag
          by this repository's *Build tools* workflow, because the upstream release only has an ARM64 Windows build.

          SHA-256 of the exe: ``$hash``

          Used by tools/fetch-tools.ps1. Not a Smash It release.
          "@ | Set-Content notes.md -Encoding utf8
          # No checkout of this repository here: name it for gh.
          gh release create $env:GITHUB_REF_NAME dist/* --repo $env:GITHUB_REPOSITORY --prerelease --latest=false `
            --title "Build tool: oxvg $version (Windows x64)" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ffmpeg:
    # Tags "tools-ffmpeg-<version>-slim" publish; a manual run only builds (artifact), to try changes.
    if: startsWith(github.ref_name, 'tools-ffmpeg-') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      FFMPEG_TAG: n9.0.2
      MSYSTEM: UCRT64
      CHERE_INVOKING: '1'
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = $env:FFMPEG_TAG.TrimStart('n')
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "tools-ffmpeg-$version-slim") {
            throw "The tag should be tools-ffmpeg-$version-slim for FFMPEG_TAG $env:FFMPEG_TAG."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Libraries (MSYS2)
        run: |
          pacman -Sy --noconfirm --needed make diffutils git \
            mingw-w64-ucrt-x86_64-{gcc,nasm,pkgconf,zlib,x264,x265,svt-av1,libvpx,lame,opus,libvorbis,libogg,dav1d,mpg123}
          # The libraries linked into ffmpeg.exe: "<source package base> <version>", the name of their MSYS2 source
          # package (an epoch "1:" is written "1~" there). The C/C++ runtimes (gcc-libs, winpthreads) are linked too.
          runtimes=$(pacman -Qqo /ucrt64/lib/libstdc++.a /ucrt64/lib/libwinpthread.a "$(gcc -print-libgcc-file-name)" | sort -u)
          for p in $(printf 'mingw-w64-ucrt-x86_64-%s\n' x264 x265 svt-av1 libvpx lame opus libvorbis libogg dav1d mpg123 zlib) $runtimes; do
            # The installed version (the one linked), and its base name from pacman's local database.
            version=$(pacman -Q "$p" | cut -d' ' -f2)
            base=$(awk '/^%BASE%$/ {getline; print; exit}' "/var/lib/pacman/local/$p-$version/desc")
            echo "${base:?no base for $p} ${version//:/~}"
          done | sort -u > libraries.txt
          cat libraries.txt
          # x265's pkg-config asks for -lgcc_s, the import library of libgcc_s_seh-1.dll: without it, everything links
          # statically and ffmpeg.exe needs no DLL.
          sed -i 's/ -lgcc_s//g' /ucrt64/lib/pkgconfig/x265.pc
          grep '^Libs' /ucrt64/lib/pkgconfig/x265.pc

      - name: Build
        run: |
          git clone --depth 1 --branch "$FFMPEG_TAG" https://git.ffmpeg.org/ffmpeg.git ffsrc
          cd ffsrc
          ../tools/ffmpeg-configure.sh
          make -j"$(nproc)"
          strip ffmpeg.exe
          ls -l ffmpeg.exe

      - name: Configure log
        if: failure()
        run: tail -n 60 ffsrc/ffbuild/config.log || true

      - name: Check
        run: |
          cd ffsrc
          # Everything Smash It and its tests ask of ffmpeg.
          ./ffmpeg.exe -hide_banner -encoders > encoders.txt
          for e in libx264 libx265 libsvtav1 libvpx-vp9 aac libmp3lame libopus libvorbis flac pcm_s16le pcm_f32le mjpeg gif; do
            grep -q " $e " encoders.txt || { echo "Encoder $e missing"; exit 1; }
          done
          # Non-system DLLs the exe needs: shipped next to it (the libraries MSYS2 has no static build of).
          { ldd ffmpeg.exe | grep -i '/ucrt64/' || true; } | awk '{print $3}' | tee ../dlls.txt
          ./ffmpeg.exe -hide_banner -f lavfi -i testsrc2=s=320x240:d=1 -f lavfi -i sine=d=1 \
            -c:v libx264 -c:a aac -y check.mp4
          ./ffmpeg.exe -hide_banner -i check.mp4 -f null -

      - name: Package
        id: package
        run: |
          version='${{ steps.version.outputs.value }}'
          # Smash It runs ffmpeg.exe on its own: no DLL may be needed.
          if [ -s dlls.txt ]; then echo "ffmpeg.exe needs DLLs:"; cat dlls.txt; exit 1; fi
          mkdir -p dist
          cp ffsrc/ffmpeg.exe "dist/ffmpeg-$version-slim-win64.exe"
          cp ffsrc/COPYING.GPLv3 dist/ffmpeg-LICENSE.txt
          cp tools/ffmpeg-configure.sh libraries.txt dist/
          # Corresponding source: FFmpeg at the tag, and the MSYS2 source package of every library linked in.
          git -C ffsrc archive --format=tar.gz --prefix="ffmpeg-$version/" -o "../dist/ffmpeg-source-$version.tar.gz" HEAD
          while read -r base ver; do
            curl -fsSL -o "dist/$base-$ver.src.tar.zst" "https://repo.msys2.org/mingw/sources/$base-$ver.src.tar.zst" \
              || { echo "No source package $base-$ver"; exit 1; }
          done < libraries.txt
          ls -l dist
          sha256sum dist/*.exe

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: ffmpeg-slim
          path: dist/

      - name: Publish
        if: github.ref_type == 'tag'
        # Git Bash rather than MSYS2: it has the GitHub CLI on its PATH.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > notes.md <<NOTES
          ffmpeg $version (GPL), Windows x64, built by this repository's "Build tools" workflow with only what Smash It
          uses: x264, x265, SVT-AV1, libvpx (VP9), LAME, Opus, Vorbis, FLAC, AAC, dav1d for AV1 input, and the
          containers and filters the app needs. Configure flags: \`ffmpeg-configure.sh\`; library versions:
          \`libraries.txt\` (MSYS2 UCRT64).

          A single static exe, no DLL. SHA-256: \`$(sha256sum dist/*.exe | cut -d' ' -f1)\`

          Source: FFmpeg at tag \`$FFMPEG_TAG\` and the MSYS2 source package of every library are attached.

          Used by tools/fetch-tools.ps1. Not a Smash It release.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/ffmpeg-LICENSE.txt dist/*.tar.gz dist/*.src.tar.zst dist/ffmpeg-configure.sh dist/libraries.txt \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "Build tool: ffmpeg $version slim (Windows x64)" --notes-file notes.md

  pngquant:
    if: startsWith(github.ref_name, 'tools-pngquant-')
    runs-on: windows-latest
    env:
      # pngquant.org's only Windows build, unversioned and slow to answer (CI downloads timed out): mirrored unchanged.
      # Change the four together.
      BUILD_URL: https://pngquant.org/pngquant-windows.zip
      BUILD_SHA256: bd0257aeeccfe446a4cd764927e26f8af6051796f28abed104307284107b120d
      # Its source (GPL-3.0): pngquant at the tag, and libimagequant at the commit that tag's "lib" submodule points to.
      PNGQUANT_TAG: '2.17.0'
      LIBIMAGEQUANT_COMMIT: a6cc4ade66710ec799ca41297f6d2c2b4070d0ff
    steps:
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^tools-pngquant-', ''
          if ($version -ne $env:PNGQUANT_TAG) { throw "The tag says $version, the pinned build is $env:PNGQUANT_TAG." }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Download and check
        shell: pwsh
        run: |
          # pngquant.org can be slow: a few attempts before giving up.
          for ($i = 1; $i -le 5; $i++) {
            try { Invoke-WebRequest $env:BUILD_URL -OutFile build.zip -TimeoutSec 120; break }
            catch { if ($i -eq 5) { throw }; Start-Sleep -Seconds (15 * $i) }
          }
          $hash = (Get-FileHash build.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BUILD_SHA256) { throw "SHA-256 mismatch: $hash" }
          Expand-Archive build.zip -DestinationPath build
          $exe = Get-ChildItem build -Recurse -Filter pngquant.exe | Select-Object -First 1
          $reported = (& $exe.FullName --version).Trim()
          if (-not $reported.StartsWith($env:PNGQUANT_TAG)) { throw "pngquant.exe reports $reported." }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build.zip "dist/pngquant-$version-windows.zip"
          Invoke-WebRequest "https://github.com/kornelski/pngquant/archive/refs/tags/$env:PNGQUANT_TAG.tar.gz" -OutFile "dist/pngquant-source-$env:PNGQUANT_TAG.tar.gz"
          Invoke-WebRequest "https://github.com/ImageOptim/libimagequant/archive/$env:LIBIMAGEQUANT_COMMIT.tar.gz" -OutFile "dist/libimagequant-source-$($env:LIBIMAGEQUANT_COMMIT.Substring(0, 10)).tar.gz"
          @"
          pngquant $version (GPL-3.0), Windows: ``pngquant-windows.zip`` from [pngquant.org](https://pngquant.org/), mirrored
          unchanged because that host is unversioned and sometimes too slow for CI (SHA-256 ``$env:BUILD_SHA256``).

          Source: pngquant at tag ``$env:PNGQUANT_TAG`` and libimagequant at ``$env:LIBIMAGEQUANT_COMMIT`` (the commit its
          ``lib`` submodule points to) are attached.

          Used by tools/fetch-tools.ps1. Not a Smash It release.
          "@ | Set-Content notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME dist/* --repo $env:GITHUB_REPOSITORY --prerelease --latest=false `
            --title "Build tool: pngquant $version (Windows)" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
